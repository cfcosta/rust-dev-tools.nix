name: Update Rust Manifests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # Every day at midnight

permissions:
  contents: write

jobs:
  update-rust-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix shell nixpkgs#jq nixpkgs#curl -c scripts/update-rust-manifests.sh
      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore: update rust manifests"
          file_pattern: rust-toolchain/manifests.json
